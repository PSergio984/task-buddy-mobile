name: EAS Build

# Preview APK for installable builds. Triggered manually or by pushing a
# version tag — never on normal pushes (EAS builds bill against Expo credits).
# Needs: `eas init` run locally once (links projectId in app.json) and an
# EXPO_TOKEN repo secret (expo.dev → account settings → access tokens).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview APK
        run: eas build --platform android --profile preview --non-interactive --wait
