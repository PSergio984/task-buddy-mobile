name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps: expo declares a peerOptional react-dom that npm
      # would resolve to an incompatible version for RN. The committed
      # lockfile was generated with this flag, so `npm ci` needs it too —
      # plain `npm ci` strict-validates the peer tree and rejects it.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Format check
        run: npx prettier --check .

      # critical-only: the 3 current "high" findings are all zod DoS inside
      # dev-time tooling (@expo/cli, eslint-config-expo) — none ship to the app.
      # Upstream publishes no patched zod 3.x and zod 4 is API-breaking, so the
      # only "fixes" npm offers are destructive. Dependabot watches for the real
      # patch landing in the expo tree; revisit at SDK 59.
      - name: Security audit
        run: npm audit --audit-level=critical

  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    needs: lint-typecheck
    if: vars.SONARCLOUD_ENABLED == 'true'
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: SonarCloud scan
        # sonarcloud-github-action is archived; the maintained replacement is
        # sonarqube-scan-action (pinned to the v8.2.1 commit — same pin as the
        # sibling repos' workflows, auditable and supply-chain safe).
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
